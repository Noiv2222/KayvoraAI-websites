<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Voltix AI</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="vee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B1224"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#core)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-dasharray="46 10 8 10 22 12" filter="url(#glow)"/>
  <polygon points="20,24 37,24 50,58 63,24 80,24 57,80 43,80" fill="url(#vee)" filter="url(#glow)"/>
  <polygon points="60,10 37,51 49,51 41,90 66,46 54,46 64,10" fill="none" stroke="#0B1224" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="60,10 37,51 49,51 41,90 66,46 54,46 64,10" fill="url(#bolt)" filter="url(#glow)"/>
  <g fill="#FDE047" filter="url(#glow)">
    <circle cx="14" cy="30" r="2"/>
    <circle cx="88" cy="68" r="2.2"/>
    <circle cx="82" cy="16" r="1.6"/>
    <circle cx="22" cy="84" r="1.6"/>
  </g>
</svg>
